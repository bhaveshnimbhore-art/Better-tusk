name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Build Android APK (debug, installable)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish APK to release v3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1
          name: Better Tusk v3.1 - Android APK
          body: |
            Proper Android APK for Better Tusk, built like Better DeepSeek's Android host:
            a WebView loads https://new.tusksearch.com/ai and injects the same v3 Claude skin.
            Tusk stays the backend/provider. Unofficial, not affiliated with Tusk or Anthropic.
            Install: download better-tusk-android-v3.1.apk, allow Install unknown apps for your browser/files app, then install.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
